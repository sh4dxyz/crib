<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADY OS v0.3 | Tactical White</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');
        
        :root { 
            --matrix-orange: #ffffff; 
            --bg: #0a0500;
            --text-main: #ffffff;
        }

        body, html { 
            margin: 0;
            padding: 0; 
            width: 100%; 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .crt-effect::before {
            content: " ";
            display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.02));
            z-index: 9999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        .scanline-distort {
            position: fixed;
            top: -100px; left: 0; width: 100%; height: 100px;
            background: rgba(255, 255, 255, 0.05); opacity: 0.1; z-index: 10000;
            pointer-events: none; filter: blur(5px); animation: scanline-pass 3s linear infinite;
        }

        @keyframes scanline-pass { 0% { top: -100px; } 100% { top: 100%; } }

        section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px;
            box-sizing: border-box;
            position: relative;
        }

        #hero {
            padding-top: 5vh;
            padding-bottom: 10px;
        }

        #ascii-title {
            font-family: monospace;
            white-space: pre; line-height: 1.2; 
            font-size: 1.8vw; color: var(--matrix-orange);
            text-align: center; animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .section-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 10px;
            margin: 30px 0;
            border-bottom: 1px solid var(--matrix-orange);
            padding-bottom: 10px;
            width: 80%;
            text-align: center;
            text-transform: uppercase;
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 90%;
            max-width: 1200px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border: 1px solid var(--matrix-orange);
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        /* Overlay invisible pour capturer le clic sans bloquer l'iframe en mode normal */
        .video-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* --- CINEMA MODE --- */
        #cinema-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 20000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #cinema-container {
            width: 80%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            border: 1px solid var(--matrix-orange);
            position: relative;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }

        #close-cinema {
            position: absolute;
            top: -40px; right: 0;
            color: white; font-family: 'Syncopate';
            cursor: pointer; font-size: 14px;
        }

        /* --- FORM --- */
        #contact-form {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 10px; letter-spacing: 2px; }

        input, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--matrix-orange);
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .submit-btn {
            background: none;
            border: 1px solid var(--matrix-orange);
            color: var(--matrix-orange);
            padding: 15px;
            font-family: 'Syncopate', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover { background: var(--matrix-orange); color: #000; }

        footer {
            padding: 20px; text-align: center; font-size: 9px;
            letter-spacing: 3px; opacity: 0.6;
        }

        @media (max-width: 800px) {
            #video-grid { grid-template-columns: 1fr; }
            #ascii-title { font-size: 3.5vw; }
            #cinema-container { width: 95%; }
        }
    </style>
</head>
<body class="crt-effect">
    <div class="scanline-distort"></div>

    <div id="cinema-overlay">
        <div id="cinema-container">
            <span id="close-cinema" onclick="closeCinema()">✕ FERMER LE MODE CINÉMA</span>
            <iframe id="cinema-iframe" width="100%" height="100%" src="" allowfullscreen></iframe>
        </div>
    </div>

    <section id="hero">
        <div id="ascii-title">
 ___ _  _   _   ___  __   __   ___  ___ 
/ __| || | /_\ |   \ \ \ / /  / _ \/ __|
\__ \ __ |/ _ \| |) | \ V /  | (_) \__ \
|___/_||_/_/ \_\___/   |_|    \___/|___/
                v0.3
        </div>
    </section>

    <section id="portfolio">
        <h2 class="section-title">PORTFOLIO</h2>
        <div id="video-grid">
            <div class="video-container" onclick="openCinema('Y1f_CGGupNg')">
                <div class="video-click-overlay"></div>
                <iframe src="https://www.youtube.com/embed/Y1f_CGGupNg?controls=0" frameborder="0"></iframe>
            </div>
            <div class="video-container" onclick="openCinema('9B5XMo0LKks')">
                <div class="video-click-overlay"></div>
                <iframe src="https://www.youtube.com/embed/9B5XMo0LKks?controls=0" frameborder="0"></iframe>
            </div>
            <div class="video-container" onclick="openCinema('ExgJBk3AgXk')">
                <div class="video-click-overlay"></div>
                <iframe src="https://www.youtube.com/embed/ExgJBk3AgXk?controls=0" frameborder="0"></iframe>
            </div>
            <div class="video-container" onclick="openCinema('uw9A8QfMdIw')">
                <div class="video-click-overlay"></div>
                <iframe src="https://www.youtube.com/embed/uw9A8QfMdIw?controls=0" frameborder="0"></iframe>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2 class="section-title">CONTACT</h2>
        <form id="contact-form" action="https://formspree.io/f/shady.beckoury@gmail.com" method="POST">
            <div class="form-group">
                <label>NOM</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>EMAIL</label>
                <input type="email" name="_replyto" required>
            </div>
            <div class="form-group">
                <label>MESSAGE</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">ENVOYER</button>
        </form>
    </section>

    <footer>
        TACTICAL_WHITE_v3.0 // SHADY OS // 2026
    </footer>

    <script>
        const cinemaOverlay = document.getElementById('cinema-overlay');
        const cinemaIframe = document.getElementById('cinema-iframe');

        function openCinema(videoId) {
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1`;
            cinemaIframe.src = embedUrl;
            cinemaOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Bloque le scroll derrière
        }

        function closeCinema() {
            cinemaOverlay.style.display = 'none';
            cinemaIframe.src = '';
            document.body.style.overflow = 'auto'; // Réactive le scroll
        }

        // Fermer si on clique sur le fond noir
        cinemaOverlay.addEventListener('click', function(e) {
            if (e.target === cinemaOverlay) closeCinema();
        });

        const title = document.getElementById('ascii-title');
        setInterval(() => { 
            title.style.textShadow = "2px 0 #fff, -2px 0 #fff";
            setTimeout(() => title.style.textShadow = "none", 150);
        }, 4000);
    </script>
</body>
</html>
